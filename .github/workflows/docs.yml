name: Documentation

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Install Doxygen and Graphviz
      run: sudo apt-get update && sudo apt-get install -y doxygen graphviz

    - name: Build English documentation
      run: doxygen Doxygen

    - name: Build Russian documentation
      run: doxygen Doxygen.ru

    - name: Assemble the site
      run: |
        mkdir -p site
        cp -r documentation/en site/en
        cp -r documentation/ru site/ru
        cp docs/site/index.html site/index.html
        cp images/preview.gif site/preview.gif
        touch site/.nojekyll

    - uses: actions/configure-pages@v5

    - uses: actions/upload-pages-artifact@v3
      with:
        path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
    - id: deployment
      uses: actions/deploy-pages@v4
