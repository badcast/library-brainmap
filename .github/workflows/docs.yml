name: Documentation

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
    - uses: actions/checkout@v4

    - name: Install Doxygen and Graphviz
      run: sudo apt-get update && sudo apt-get install -y doxygen graphviz

    - name: Build English documentation
      run: |
        mkdir -p documentation/en
        doxygen Doxygen

    - name: Build Russian documentation
      run: |
        mkdir -p documentation/ru
        doxygen Doxygen.ru

    - name: Assemble the site
      run: |
        mkdir -p site
        cp -r documentation/en site/en
        cp -r documentation/ru site/ru
        mkdir -p site/en/html site/ru/html
        cp -r documentation/en/* site/en/html/
        cp -r documentation/ru/* site/ru/html/
        cp docs/site/index.html site/index.html
        cp images/preview.gif site/preview.gif
        cp images/preview.gif site/en/preview.gif
        cp images/preview.gif site/ru/preview.gif
        touch site/.nojekyll

    - name: Deploy to gh-pages branch
      if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
      uses: peaceiris/actions-gh-pages@v4
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_dir: ./site
        force_orphan: true

    - name: Configure GitHub Pages
      id: pages_config
      continue-on-error: true
      uses: actions/configure-pages@v5

    - name: Upload Pages artifact
      if: steps.pages_config.outcome == 'success'
      continue-on-error: true
      uses: actions/upload-pages-artifact@v3
      with:
        path: site

    - name: Deploy to GitHub Pages
      id: deployment
      if: steps.pages_config.outcome == 'success'
      continue-on-error: true
      uses: actions/deploy-pages@v4
